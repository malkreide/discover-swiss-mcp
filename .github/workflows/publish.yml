# Dateiname zählt: 'publish.yml' ist der Wert, der auf PyPI unter
# "Workflow name" eingetragen wird — nicht der 'name:'-Wert unten.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # A4: erlaubt einen Re-Run auf dem AKTUELLEN Stand,
                          # statt einen alten fehlgeschlagenen Tag-Lauf zu wiederholen

# B5: Default fuer alle Jobs. Der publish-Job hebt sich das an, was er
# zusaetzlich braucht (id-token) — ein Release-Workflow ist der letzte Ort,
# an dem ein Job mehr Rechte tragen sollte als seine Aufgabe verlangt.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15                       # B6
    steps:
      # B4: SHA-gepinnt, nicht Tag-gepinnt — siehe Kommentar in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      # Release-Gate: prüft das GEBAUTE Artefakt, nicht die Quelldateien.
      # A1 (mcp-name-Marker in der Wheel-METADATA), A2 (description <= 100),
      # A4 (Tag == gebaute Version). Läuft VOR dem Upload — nach dem Upload
      # ist die Version unveränderlich.
      - name: Verify release artifacts
        run: |
          python scripts/check_release_artifacts.py \
            --dist dist \
            --tag "${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15                       # B6
    # A3: Dieser Wert muss auf PyPI beim Pending Publisher unter
    # "Environment name" exakt so eingetragen sein. Leer lassen ist der
    # häufigste Grund für 'invalid-publisher'.
    environment:
      name: pypi
    permissions:
      id-token: write       # Trusted Publishing via OIDC
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # B4: Diese Referenz war ein BRANCH ('release/v1'), nicht einmal ein Tag —
      # sie verschiebt sich bei jedem Push des Maintainers, und der Schritt
      # dahinter haelt das PyPI-Token. Der einzige Ort im Bundle, an dem
      # Pinning nicht optional ist.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true    # A4: verhindert Doppel-Upload beim Re-Run
