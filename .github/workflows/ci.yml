name: CI

on:
  push:
    branches: [main, master]   # E5: the default branch is not always 'main'
  pull_request:
  workflow_dispatch:

# B5: Without this block the workflow inherits the repository defaults, which
# are 'read and write' in many repositories. A job that only reads would then
# carry a token allowed to push and create releases. It belongs at workflow
# level, not per job: otherwise every job that does not override it keeps the
# default.
permissions:
  contents: read

# B6: A new push to the same pull request makes the running job worthless.
# Without this block both run to completion — and both are billed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # B6: Catches infinite loops and hanging network calls before they drain
    # the monthly minutes. GitHub's default is six hours per job.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The supported range, tested end to end rather than asserted in the
        # classifiers.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # B4: Actions are pinned to the commit SHA, not to the tag. Tags move —
      # in the tj-actions/changed-files incident (March 2025) the existing
      # version tags were repointed at a backdoored commit and every dependent
      # repository pulled it on its next regular run. The comment keeps the
      # version readable; Dependabot updates hash and comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # ruff is pinned exactly in pyproject.toml's [dev] extra, so the version
      # installed here is the one that runs below — and the same one a
      # contributor gets locally. Do not add a second `pip install ruff==...`
      # step: a second declaration is exactly how the local and CI versions
      # drifted apart in a sister repository.
      - name: Install package and dev tooling
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Second, independent gate: a green `ruff check` is no evidence of a
      # green format. Its own step so the log says which of the two fired.
      - name: Format gate
        run: ruff format --check .

      # The `live` marker hits the real discover.swiss API and needs a
      # subscription key. CI has none and must not have one.
      - name: Test
        run: pytest -m "not live"

      # Structure and documentation checks (C, B and E rules).
      - name: Validate repository structure
        run: python scripts/validate_repo.py .
