# Ziel: .github/dependabot.yml — NICHT .github/workflows/. Liegt hier nur,
# weil das Bundle alle .github-Vorlagen an einem Ort haelt.
#
# B4 macht Pinning erst tragfaehig: gepinnte SHAs frieren sonst auf dem Stand
# des Tages ein, an dem das Repo entstand. Dependabot zieht Hash UND
# Versionskommentar gemeinsam nach, sodass die Zeile lesbar bleibt.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Ein PR pro Woche fuer alle Actions statt einer pro Action. Bei vielen
    # Repos ist die Zahl der PRs das eigentliche Problem, nicht ihr Inhalt:
    # was einzeln aufschlaegt, wird nicht gelesen, sondern weggeklickt.
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  # DEP-001: the Python dependencies. Their ranges are capped in pyproject.toml;
  # Dependabot proposes the next major as a pull request instead of a resolver
  # taking it silently on a fresh install.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  # The base image in the Dockerfile is pinned by digest (SEC-007); a digest
  # never moves by itself, so security fixes arrive only through this entry.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "docker"
